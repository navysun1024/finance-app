server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    client_max_body_size 10m;

    # Gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # 确保 SVG favicon 有正确的 MIME type
    location = /favicon.svg {
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
    }

    # ── API 代理 ──

    # 内部后端 API (db-server:3002) —— 前端核心数据接口
    # 必须放在外部 API 代理之前，避免被 /api/fund/ 等外部前缀误匹配
    location ~ ^/api/(products|transactions|nav-history|product-dividends|batch-import|fund/nav|fund/purchase-limit|fund/dividends) {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 数据库 API (旧路径兼容): /api/db/* → localhost:3002/*
    location /api/db/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 爬虫服务: /api/scrape/* → localhost:3001
    location /api/scrape/ {
        proxy_pass http://127.0.0.1:3001/api/scrape/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 净值定时任务: /api/nav-scheduler/* → localhost:3002
    location /api/nav-scheduler/ {
        proxy_pass http://127.0.0.1:3002/api/nav-scheduler/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 天天基金实时估值: /api/fund/* → fundgz.1234567.com.cn
    location /api/fund/ {
        proxy_pass https://fundgz.1234567.com.cn/;
        proxy_set_header Host fundgz.1234567.com.cn;
        proxy_ssl_server_name on;
    }

    # 东方财富基金数据: /api/eastmoney/* → fund.eastmoney.com
    location /api/eastmoney/ {
        proxy_pass https://fund.eastmoney.com/;
        proxy_set_header Host fund.eastmoney.com;
        proxy_set_header Referer "https://fund.eastmoney.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_ssl_server_name on;
    }

    # 东方财富基金基本信息（含限购）: /api/fundf10/* → fundf10.eastmoney.com
    location /api/fundf10/ {
        proxy_pass http://fundf10.eastmoney.com/;
        proxy_set_header Host fundf10.eastmoney.com;
        proxy_set_header Referer "http://fund.eastmoney.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
    }

    # 东方财富品种数据: /api/pingzhongdata/* → fund.eastmoney.com
    location /api/pingzhongdata/ {
        proxy_pass https://fund.eastmoney.com/;
        proxy_set_header Host fund.eastmoney.com;
        proxy_set_header Referer "https://fund.eastmoney.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_ssl_server_name on;
    }

    # 东方财富移动端基金API（净值更新更快）: /api/fundmobapi/* → fundmobapi.eastmoney.com
    location /api/fundmobapi/ {
        proxy_pass https://fundmobapi.eastmoney.com/;
        proxy_set_header Host fundmobapi.eastmoney.com;
        proxy_set_header Referer "https://fund.eastmoney.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36";
        proxy_ssl_server_name on;
    }

    # ── 静态文件缓存策略 ──

    # index.html 必须不缓存，确保每次访问都拿到最新版本引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA 回退：所有非文件请求都返回 index.html（同样不缓存）
    location / {
        # 带 content hash 的资源长期缓存（1年）+ immutable 永远不重新验证
        location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # 图片缓存 30 天
        location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # 其他静态文件 + SPA 回退 → 返回 index.html（不缓存）
        try_files $uri $uri/ /index.html;
    }
}
