server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    client_max_body_size 10m;

    # ── API 代理 ──

    # 数据库 API: /api/db/* → localhost:3002
    location /api/db/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 爬虫服务: /api/scrape/* → localhost:3001
    location /api/scrape/ {
        proxy_pass http://127.0.0.1:3001/api/scrape/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 净值定时任务: /api/nav-scheduler/* → localhost:3002
    location /api/nav-scheduler/ {
        proxy_pass http://127.0.0.1:3002/api/nav-scheduler/;
        proxy_set_header Host $host;
    }

    # 天天基金实时估值: /api/fund/* → fundgz.1234567.com.cn
    location /api/fund/ {
        proxy_pass https://fundgz.1234567.com.cn/;
        proxy_set_header Host fundgz.1234567.com.cn;
        proxy_ssl_server_name on;
    }

    # 东方财富基金数据: /api/eastmoney/* → fund.eastmoney.com
    location /api/eastmoney/ {
        proxy_pass https://fund.eastmoney.com/;
        proxy_set_header Host fund.eastmoney.com;
        proxy_set_header Referer "https://fund.eastmoney.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_ssl_server_name on;
    }

    # 东方财富品种数据: /api/pingzhongdata/* → fund.eastmoney.com
    location /api/pingzhongdata/ {
        proxy_pass https://fund.eastmoney.com/;
        proxy_set_header Host fund.eastmoney.com;
        proxy_set_header Referer "https://fund.eastmoney.com/";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_ssl_server_name on;
    }

    # ── 静态文件 + SPA 回退 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # sql-wasm 文件需要正确的 MIME type
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
    }
}
